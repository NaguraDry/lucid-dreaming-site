title: 改めていま、幽体離脱をひもとく
lang: ja
url: "https://naguradry.github.io"
baseurl: "/lucid-dreaming-site"
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache
markdown: kramdown
color_scheme: calm
search_enabled: false
nav_enabled: true
heading_anchors: true
aux_links: {}
gh_edit_link: false
back_to_top: true
back_to_top_text: ページの先頭へ
# Decorative artwork: wide composition on desktop, original composition on mobile.
hero_desktop: /assets/images/hero-watercolor-wide.jpg
hero_mobile: /assets/images/hero-watercolor-mobile.jpg
defaults:
  - scope:
      path: ""
    values:
      layout: default
      has_toc: false
      image:
        path: /assets/images/hero-watercolor-mobile.jpg
        width: 1672
        height: 941
        alt: "湖と木陰のベンチ、本を描いた水彩画"
      twitter:
        card: summary_large_image
  - scope:
      path: "assets"
    values:
      layout: null
  - scope:
      path: "index.md"
    values:
      title: "幽体離脱のやり方を明晰夢研究から整理"
      nav_title: "はじめに"
      nav_order: 1
      layout: home
  - scope:
      path: "techniques/index.md"
    values:
      title: "技法一覧"
      parent: "実践ガイド"
      nav_order: 2
      has_children: true
  - scope:
      path: "for-vip-readers.md"
    values:
      title: "まとめに親しんできた方へ"
      nav_order: 3
  - scope:
      path: "four-perspectives.md"
    values:
      title: "離脱の4つの立場"
      nav_order: 4
  - scope:
      path: "faq.md"
    values:
      title: "FAQ"
      nav_order: 5
  - scope:
      path: "techniques/deild.md"
    values:
      title: "DEILD（目覚めた直後に戻る）"
      nav_order: 5
      parent: "技法一覧"
      grand_parent: "実践ガイド"
  - scope:
      path: "techniques/dream-journal.md"
    values:
      title: "夢日記"
      nav_order: 6
      parent: "技法一覧"
      grand_parent: "実践ガイド"
  - scope:
      path: "techniques/fild.md"
    values:
      title: "FILD（指を小さく動かす）"
      nav_order: 7
      parent: "技法一覧"
      nav_exclude: true
      grand_parent: "実践ガイド"
  - scope:
      path: "techniques/mild.md"
    values:
      title: "MILD（記銘による誘発）"
      nav_order: 8
      parent: "技法一覧"
      grand_parent: "実践ガイド"
  - scope:
      path: "techniques/reality-checks.md"
    values:
      title: "リアリティチェック（RT）"
      nav_order: 9
      parent: "技法一覧"
      nav_exclude: true
      grand_parent: "実践ガイド"
  - scope:
      path: "techniques/sleep-paralysis.md"
    values:
      title: "金縛りからの離脱"
      nav_order: 10
      parent: "技法一覧"
      grand_parent: "実践ガイド"
  - scope:
      path: "techniques/ssild.md"
    values:
      title: "SSILD（感覚を巡る）"
      nav_order: 11
      parent: "技法一覧"
      grand_parent: "実践ガイド"
  - scope:
      path: "techniques/tlr.md"
    values:
      title: "TLR（感覚キュー）"
      nav_order: 12
      parent: "技法一覧"
      nav_exclude: true
      grand_parent: "実践ガイド"
  - scope:
      path: "techniques/wbtb.md"
    values:
      title: "WBTB（一度起きて寝直す）"
      nav_order: 13
      parent: "技法一覧"
      grand_parent: "実践ガイド"
  - scope:
      path: "techniques/wild.md"
    values:
      title: "WILD（覚醒から夢へ移る）"
      nav_order: 14
      parent: "技法一覧"
      grand_parent: "実践ガイド"

  - scope:
      path: ""
      type: home_sections
    values:
      layout: null
      nav_exclude: true
      search_exclude: true
      sitemap: false
# A home fragment is content for index, not an independent article.
collections:
  home_sections:
    output: false
